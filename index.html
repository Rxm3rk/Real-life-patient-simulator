<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B14" />
    <meta
      name="description"
      content="Bedside is a realistic general-surgery patient simulator: take a history, perform the examination step by step, investigate, diagnose and get OSCE-style feedback."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bedside" />
    <meta property="og:title" content="Bedside — Surgical Patient Simulator" />
    <meta
      property="og:description"
      content="See patients, examine them step by step the way Macleod's teaches, and ace your surgery OSCEs."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Bedside — Surgical Patient Simulator</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      ;(function () {
        var theme = 'system'
        try {
          var raw = localStorage.getItem('bedside.settings')
          if (raw) theme = (JSON.parse(raw).state || {}).theme || 'system'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
