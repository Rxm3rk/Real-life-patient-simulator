<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070B14" />
    <meta
      name="description"
      content="Bedside is a realistic general-surgery patient simulator: take a history, perform the examination step by step, investigate, diagnose and get OSCE-style feedback."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bedside" />
    <meta property="og:title" content="Bedside — Surgical Patient Simulator" />
    <meta
      property="og:description"
      content="See patients, examine them step by step the way Macleod's teaches, and ace your surgery OSCEs."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Bedside — Surgical Patient Simulator</title>
    <script>
      // With no data-theme the CSS follows the OS. Before first paint, remember any
      // theme the hosting page stamped, then apply an explicit choice saved in settings.
      ;(function () {
        var root = document.documentElement
        window.__bedsideHostTheme = root.getAttribute('data-theme')
        try {
          var raw = localStorage.getItem('bedside.settings')
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null
          if (theme === 'dark' || theme === 'light') root.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
